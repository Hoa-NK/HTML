	<p><b>2. Phnom Penh</b></p>
		<img src = "PhnomPenh.jpg" alt = "hình Phnom Penh" class="style-img">
		<button onclick = "Phnôm Pênh còn gọi là Nam Vang hay Nam Vinh là thành phố lớn nhất và là thủ đô của Vương quốc Campuchia.
			Từng được gọi là "Hòn ngọc châu Á" thập niên 1920, Nam Vang cùng với Xiêm Riệplà hai thành phố thu hút khách du lịch nội địa và quốc tế của Campuchia.
			Thành phố này có nhiều toà nhà mang ảnh hưởng kiến trúc Pháp cùng nhiều công trình đặc sắc của kiến trúc Khmer.
			Với dân số là 2,2 triệu người (2011), thành phố này là trung tâm chính trị, văn hóa, thương mại của Campuchia.">

	<p><b>3. Siem Reap</b></p>
		<img src = "SiemReap.jpg" alt = "hình Siem Reap" class="style-img">
		<button onclick = "Siem Reap, viên ngọc quý của Campuchia, không chỉ là cửa ngõ dẫn vào quần thể Angkor Wat huyền thoại mà còn là một thành phố cổ kính ẩn chứa vô vàn điều kỳ diệu.
			Với bề dày lịch sử hàng ngàn năm, nơi đây thu hút hàng triệu du khách mỗi năm bởi những di tích kiến trúc độc đáo, văn hóa Khmer đậm đà và nhịp sống bình dị nhưng đầy cuốn hút.
			Nếu bạn đang ấp ủ một chuyến đi khám phá cố đô Siem Reap, những kinh nghiệm dưới đây từ Du Lịch Việt sẽ là cẩm nang hữu ích, giúp hành trình của bạn thêm phần trọn vẹn và đáng nhớ.">
